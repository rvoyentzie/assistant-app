<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rich AI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Rich AI</title>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f5f7; --text:#111318; --muted:#6a7280;
  --border:#e6e8ec; --accent:#111318; --accent-text:#ffffff; --user:#111318; --user-text:#ffffff;
  --bot:#f4f5f7; --danger:#e5484d; --drawer:#f7f8fa; --shadow:0 1px 2px rgba(16,18,24,.06),0 6px 20px rgba(16,18,24,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0d12; --surface:#0b0d12; --surface-2:#191c24; --text:#ececf1; --muted:#9aa1b2;
    --border:#242833; --accent:#ffffff; --accent-text:#0b0d12; --user:#2a2f3a; --user-text:#ececf1;
    --bot:#17191f; --danger:#ff6369; --drawer:#111318; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased;overflow:hidden}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:11px;background:transparent;color:var(--text);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.95)}

/* Header */
header{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--border)}
header .title{flex:1;text-align:center;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

/* Log */
#log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.empty{margin:auto;max-width:320px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;padding:24px}
.empty .big{font-size:22px;color:var(--text);font-weight:600}
.empty .sub{font-size:14.5px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-text);border-bottom-right-radius:7px}
.msg.bot{align-self:flex-start;background:var(--bot);color:var(--text);border-bottom-left-radius:7px}
.msg.sys{align-self:center;max-width:92%;text-align:center;color:var(--muted);font-size:12.5px;background:transparent;padding:0}
.msg img{display:block;max-width:190px;border-radius:14px;margin-bottom:8px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:2px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.9;transform:translateY(-3px)}}

/* Composer */
#composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.cwrap{flex:1;display:flex;align-items:flex-end;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:24px;padding:4px 4px 4px 6px}
.cwrap:focus-within{border-color:var(--muted)}
#q{flex:1;resize:none;min-height:36px;max-height:150px;padding:8px 6px;border:0;background:transparent;color:var(--text);font:inherit}
#q:focus{outline:none}
.rb{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--text);cursor:pointer}
.rb.primary{background:var(--accent);color:var(--accent-text)}
.rb.active{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}50%{box-shadow:0 0 0 7px rgba(229,72,77,0)}}
button:disabled{opacity:.45}

/* Toast */
#status{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center;z-index:40}
#status.show{opacity:.96}

/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:84%;max-width:320px;background:var(--drawer);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .22s ease;z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.open{transform:translateX(0)}
.dtop{padding:12px}
.newbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.dlist{flex:1;overflow:auto;padding:4px 8px}
.dlabel{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 8px 6px}
.chat{display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:12px;cursor:pointer;color:var(--text)}
.chat:hover{background:var(--surface-2)}
.chat.active{background:var(--surface-2)}
.chat .ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.chat .del{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;opacity:.7}
.chat .del:hover{background:var(--border);color:var(--danger)}
.dfoot{border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.dfoot button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:var(--text);font:inherit;cursor:pointer}
.dfoot button:hover{background:var(--surface-2)}

/* Live camera mode */
#live{position:fixed;inset:0;background:#000;z-index:70;display:none;flex-direction:column}
#live.open{display:flex}
#live video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#live .ltop{position:relative;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 0;z-index:2}
#live .lbtn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;cursor:pointer}
#live .lcaption{position:relative;margin-top:auto;z-index:2;color:#fff;padding:14px 18px;font-size:16px;line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.8);max-height:40%;overflow:auto}
#live .lbar{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:20px;padding:10px 0 calc(26px + env(safe-area-inset-bottom))}
#live .lmic{width:74px;height:74px;border-radius:50%;border:0;background:#fff;color:#111;display:grid;place-items:center;cursor:pointer}
#live .lmic.active{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
#live .lmic .ic{width:30px;height:30px}

/* Settings */
#settings{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:80}
#settings.open{display:flex}
#settings .shead{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;border-bottom:1px solid var(--border)}
#settings .shead h2{margin:0;font-size:17px}
#settings .sbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.group{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.group h3{margin:0 0 2px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.field input,label.field select{padding:11px;border-radius:11px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
label.field input:focus,label.field select:focus{outline:none;border-color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--text);font-size:15px}
.switch{position:relative;width:46px;height:28px;flex:0 0 46px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.2s}
.switch span::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(18px)}
.btn{padding:12px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
.hint{color:var(--muted);font-size:12.5px;margin:0;line-height:1.5}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="menu" type="button" aria-label="Chats">
    <svg class="ic" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="title" id="htitle">Rich AI</div>
  <button class="iconbtn" id="newtop" type="button" aria-label="New chat">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
  </button>
</header>

<main id="log" aria-live="polite"></main>

<form id="composer">
  <div class="cwrap">
    <button type="button" class="rb" id="camera" aria-label="Live camera">
      <svg class="ic" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <textarea id="q" rows="1" placeholder="Message" autocomplete="off"></textarea>
    <button type="button" class="rb" id="mic" aria-label="Talk">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
  </div>
  <button type="submit" class="rb primary" id="send" aria-label="Send">
    <svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>
</form>

<div id="status"></div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dtop">
    <button class="newbtn" id="newdrawer" type="button">
      <svg class="ic" viewBox="0 0 24 24"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      New chat
    </button>
  </div>
  <div class="dlabel">Recent</div>
  <div class="dlist" id="dlist"></div>
  <div class="dfoot">
    <button id="opensettings" type="button">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </div>
</aside>

<section id="live">
  <video id="lvideo" autoplay playsinline muted></video>
  <div class="ltop">
    <button class="lbtn" id="lclose" type="button" aria-label="Close">
      <svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lbtn" id="lflip" type="button" aria-label="Flip camera">
      <svg class="ic" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
  <div class="lcaption" id="lcaption">Point the camera and tap the mic to ask about what you see.</div>
  <div class="lbar">
    <button class="lmic" id="lmic" type="button" aria-label="Ask">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
  </div>
</section>

<section id="settings">
  <div class="shead">
    <h2>Settings</h2>
    <button class="iconbtn" id="s-close" type="button" aria-label="Close settings">
      <svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sbody">
    <div class="group">
      <h3>Connection</h3>
      <label class="field">Assistant endpoint<input type="url" id="s-endpoint" placeholder="https://xxxx.supabase.co/functions/v1/assistant-live" autocapitalize="off" autocomplete="off"></label>
      <label class="field">Access token<input type="password" id="s-token" autocomplete="off"></label>
      <p class="hint">Settings stay on this phone. The token lets this app reach your assistant; keep it private.</p>
    </div>
    <div class="group">
      <h3>Voice</h3>
      <div class="row"><span>Speak replies</span><label class="switch"><input type="checkbox" id="s-voice" checked><span></span></label></div>
      <div class="row"><span>Premium voice (ElevenLabs)</span><label class="switch"><input type="checkbox" id="s-premium"><span></span></label></div>
      <label class="field">Premium voice<select id="s-elvoice"></select></label>
      <label class="field">Phone voice (fallback)<select id="s-voicepick"></select></label>
      <button class="btn ghost" id="s-voicetest" type="button">Test voice</button>
    </div>
    <div class="group">
      <h3>Behavior</h3>
      <div class="row"><span>Send when I stop talking</span><label class="switch"><input type="checkbox" id="s-autosend" checked><span></span></label></div>
      <label class="field">Speech recognition<select id="s-stt"><option value="eleven">ElevenLabs streaming (recommended)</option><option value="phone">Phone's built-in recognizer</option></select></label>
      <label class="field">Pause before sending<select id="s-pause"><option value="quick">Quick — sends sooner, may cut you off</option><option value="normal">Normal</option><option value="patient">Patient — waits longer for you</option></select></label>
    </div>
    <div class="group">
      <h3>Voice diagnostics</h3>
      <pre id="diag" class="hint" style="white-space:pre-wrap;max-height:40vh;overflow:auto;margin:0;font-size:11px;line-height:1.4"></pre>
    </div>
    <p class="hint" id="verline" style="text-align:center"></p>
  </div>
</section>

<canvas id="canvas" hidden></canvas>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // Stamped by tools/publish_app.sh at publish time (date, time, and commit), so Settings shows which build is running.
  const BUILD = '2026-10-18 14:15 · 38c74af';
  const diag = [];
  function dlog(m){ try { console.log('[voice] ' + m); } catch {} const d = new Date(); diag.push(d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0') + ' ' + m); if (diag.length > 60) diag.shift(); const el = $('diag'); if (el) el.textContent = diag.join('\n'); }
  window.addEventListener('error', (e) => dlog('JS error: ' + (e.message || e.type)));
  window.addEventListener('unhandledrejection', (e) => dlog('Unhandled: ' + ((e.reason && (e.reason.message || e.reason.name)) || e.reason)));
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  };
  const cfg = {
    endpoint: store.get('endpoint',''), token: store.get('token',''),
    voice: store.get('voice', true), autosend: store.get('autosend', true),
    voiceURI: store.get('voiceURI',''), premium: store.get('premium', false), elVoice: store.get('elVoice',''),
    pause: store.get('pause', 'normal'), stt: store.get('stt', 'eleven'),
  };
  let busy = false;

  // ---- Conversations ----
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const titleOf = (msgs) => { const u = msgs.find((m) => m.role === 'user'); return u ? u.content.replace(/\s+/g,' ').slice(0, 42) : 'New chat'; };
  let chats = store.get('chats', null);
  let currentId = store.get('currentId', null);
  if (!Array.isArray(chats)) {
    const old = store.get('history', []);
    chats = (Array.isArray(old) && old.length) ? [{ id: uid(), title: titleOf(old), messages: old, updatedAt: Date.now() }] : [];
    currentId = chats[0] ? chats[0].id : null;
    saveChats();
  }
  function saveChats(){ store.set('chats', chats); store.set('currentId', currentId); }
  function current(){
    let c = chats.find((x) => x.id === currentId);
    if (!c){ c = { id: uid(), title: 'New chat', messages: [], updatedAt: Date.now() }; chats.unshift(c); currentId = c.id; saveChats(); }
    return c;
  }
  function newChat(){
    const existing = chats.find((x) => x.messages.length === 0);
    if (existing){ currentId = existing.id; } else { const c = { id: uid(), title: 'New chat', messages: [], updatedAt: Date.now() }; chats.unshift(c); currentId = c.id; }
    saveChats(); renderMessages(); renderDrawer(); closeDrawer(); $('q').focus();
  }
  function selectChat(id){ currentId = id; saveChats(); renderMessages(); renderDrawer(); closeDrawer(); }
  function deleteChat(id){
    chats = chats.filter((x) => x.id !== id);
    if (currentId === id) currentId = chats[0] ? chats[0].id : null;
    saveChats(); renderMessages(); renderDrawer();
  }

  // ---- Rendering ----
  function scrollToBottom(){ const l = $('log'); requestAnimationFrame(() => { l.scrollTop = l.scrollHeight; }); }
  function bubble(role, text, imgData){
    const d = document.createElement('div'); d.className = 'msg ' + role;
    if (imgData){ const i = document.createElement('img'); i.src = 'data:image/jpeg;base64,' + imgData; i.alt = 'photo'; d.appendChild(i); }
    if (text) d.appendChild(document.createTextNode(text));
    $('log').appendChild(d); return d;
  }
  function renderMessages(){
    const log = $('log'); log.innerHTML = '';
    const c = chats.find((x) => x.id === currentId);
    $('htitle').textContent = (c && c.messages.length) ? c.title : 'Rich AI';
    if (!c || !c.messages.length){
      const e = document.createElement('div'); e.className = 'empty';
      e.innerHTML = '<div class="big">How can I help?</div><div class="sub">Ask anything. I can search the web, and you can tap the camera to show me something live.</div>';
      log.appendChild(e); return;
    }
    for (const m of c.messages) bubble(m.role === 'user' ? 'user' : 'bot', m.content);
    scrollToBottom();
  }
  function renderDrawer(){
    const list = $('dlist'); list.innerHTML = '';
    if (!chats.length){ const p = document.createElement('div'); p.className = 'hint'; p.style.padding = '8px'; p.textContent = 'No conversations yet.'; list.appendChild(p); return; }
    for (const c of chats){
      const row = document.createElement('div'); row.className = 'chat' + (c.id === currentId ? ' active' : '');
      const t = document.createElement('div'); t.className = 'ct'; t.textContent = c.messages.length ? c.title : 'New chat';
      t.onclick = () => selectChat(c.id);

      const res = await fetch(cfg.endpoint, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.token }, body: JSON.stringify({ question, image: image ? { media_type:'image/jpeg', data:image } : undefined, history: chat.messages.slice(0, -1).slice(-12) }) });
      const data = await res.json().catch(() => ({}));
      if (thinking) thinking.remove();
      if (!res.ok){ const em = 'Error ' + res.status + ': ' + (data.error || res.statusText); if (!liveOpen){ bubble('sys', em); scrollToBottom(); } else status(em); return; }
      const answer = data.text || '(no answer)';
      chat.messages.push({ role: 'assistant', content: answer }); chat.updatedAt = Date.now(); saveChats();
      if (!liveOpen){ bubble('bot', answer); for (const ev of (data.tool_events || [])) bubble('sys', ev.name + ': ' + ev.summary); scrollToBottom(); renderDrawer(); }
      else { $('lcaption').textContent = answer; }
      await speak(answer);
    }catch(e){ if (thinking) thinking.remove(); const em = 'Network error: ' + e.message; if (!liveOpen){ bubble('sys', em); scrollToBottom(); } else status(em); }
    finally{ busy = false; $('send').disabled = false; }
  }

  // ---- Settings ----
  function openSettings(){ $('s-endpoint').value=cfg.endpoint; $('s-token').value=cfg.token; $('s-voice').checked=cfg.voice; $('s-autosend').checked=cfg.autosend; $('s-pause').value=cfg.pause||'normal'; $('s-stt').value=cfg.stt||'eleven'; $('s-premium').checked=cfg.premium; loadVoices(); $('s-voicepick').value=cfg.voiceURI||''; loadPremiumVoices(); $('diag').textContent = diag.join('\n') || '(no voice activity yet)'; $('verline').textContent = 'Version ' + (BUILD.startsWith('__') ? 'dev (unpublished)' : BUILD); closeDrawer(); $('settings').classList.add('open'); }
  function saveSettings(){ cfg.endpoint=$('s-endpoint').value.trim(); cfg.token=$('s-token').value.trim(); cfg.voice=$('s-voice').checked; cfg.autosend=$('s-autosend').checked; cfg.pause=$('s-pause').value||'normal'; cfg.stt=$('s-stt').value||'eleven'; cfg.voiceURI=$('s-voicepick').value; cfg.premium=$('s-premium').checked; cfg.elVoice=$('s-elvoice').value; for(const k of ['endpoint','token','voice','autosend','pause','stt','voiceURI','premium','elVoice']) store.set(k,cfg[k]); }

  // ---- Wire up ----
  $('menu').onclick = openDrawer;
  $('scrim').onclick = closeDrawer;
  $('newtop').onclick = newChat;
  $('newdrawer').onclick = newChat;
  $('opensettings').onclick = openSettings;
  $('s-close').onclick = () => { saveSettings(); $('settings').classList.remove('open'); };
  $('s-voicetest').onclick = () => { saveSettings(); const sample='Hi, this is your assistant. How do I sound?'; const uri=$('s-voicepick').value; const nativeTest=()=>speakWith(sample, uri?voices.find(x=>x.voiceURI===uri):bestVoice()); if($('s-premium').checked&&cfg.endpoint&&cfg.token) speakPremium(sample,$('s-elvoice').value).catch((e)=>{status('Premium voice failed ('+e.message+'); using phone voice.');nativeTest();}); else nativeTest(); };
  $('camera').onclick = openLive;
  $('lclose').onclick = closeLive;
  $('lflip').onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; await startCamera($('lvideo')); };
  $('lmic').onclick = () => { if (convoOn){ stopConvo(); $('lcaption').textContent = 'Paused — tap the mic to talk.'; } else startConvo(); };
  $('mic').onclick = () => { if (convoOn){ stopConvo(); status('Stopped listening.'); } else startConvo(); };
  $('composer').onsubmit = (e) => { e.preventDefault(); send(); };
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  $('q').addEventListener('input', (e) => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(150, t.scrollHeight) + 'px'; });

  renderMessages();
  renderDrawer();
  if (!cfg.endpoint || !cfg.token) status('Open the menu, then Settings, to add your endpoint and token.');
  if (window.speechSynthesis){ try{ speechSynthesis.onvoiceschanged = loadVoices; }catch{} loadVoices(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
